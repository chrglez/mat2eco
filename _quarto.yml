project:
  type: book
  output-dir: _site
  # Ademas de los capitulos: la presentacion Reveal.js del tema 2 (enlazada desde Descargas).
  render:
    - index.qmd
    - capitulos/*.qmd
    - laboratorio/*.qmd
    - descargas.qmd
  resources:
    - transparencias/tema1/Trans_tema1.pdf
    - transparencias/tema2/Trans_tema2.pdf
    - transparencias/tema3/Trans_tema3.pdf
    - transparencias/tema4/Trans_tema4.pdf
    - mat2eco_presentacion/presentacion_asignatura.pdf
    - mat2eco_presentacion/guiadocentemat2eco2526.pdf

lang: es

book:
  title: "Matemáticas para la Economía II"
  subtitle: "Apuntes y laboratorio"
  author: "Christian González-Martel"
  date: today
  date-format: "D MMMM YYYY"
  site-url: https://chrglez.github.io/mat2eco/
  repo-url: https://github.com/chrglez/mat2eco
  repo-actions: [issue]
  search: true
  page-footer:
    center: "Universidad de Las Palmas de Gran Canaria"
  chapters:
    - index.qmd
    - part: "Apuntes"
      chapters:
        - capitulos/tema1.qmd
        - capitulos/tema2.qmd
        - capitulos/tema3.qmd
        - capitulos/tema4.qmd
    - part: "Laboratorio"
      chapters:
        - laboratorio/index.qmd
        - laboratorio/curvas-de-nivel-gradiente.qmd
        - laboratorio/lagrange.qmd
  appendices:
    - descargas.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    code-fold: true
    code-summary: "Ver el código"
    lang: es
    math: mathjax

execute:
  echo: true
  warning: false
jupyter: python3
