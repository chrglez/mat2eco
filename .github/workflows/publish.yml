name: Publicar sitio

on:
  push:
    branches: [main]
    paths:
      - "_quarto.yml"
      - "*.qmd"
      - "styles.scss"
      - "laboratorio/**"
      - "transparencias/tema2/web/**"
      - "transparencias/tema2/img-png/**"
      - "requirements.txt"
      - "transparencias/**/*.pdf"
      - "mat2eco_presentacion/*.pdf"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
